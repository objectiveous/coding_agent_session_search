# Standalone workspace — keeps cass-ffi outside cass's implicit workspace
# (cass has `[workspace.metadata.dist]`, which makes any nested Cargo.toml
# an auto-member otherwise). Upstream rebases of cass's Cargo.toml never
# touch cass-ffi's existence.
[workspace]

[package]
name = "cass-ffi"
version = "0.1.0"
edition = "2024"
authors = ["OneApp"]
description = "FFI shim exposing the cass (coding-agent-search) library surface to Swift via UniFFI"
license-file = "../LICENSE"
publish = false

# Intentionally NOT a member of cass's [package] — kept as a sibling [package]
# so upstream rebases of coding_agent_session_search/Cargo.toml stay clean.
# We path-dep onto cass via `coding-agent-search = { path = ".." }`.

[lib]
name = "cass_ffi"
# `staticlib` for archive linking into the xcframework.
# `cdylib` for the UniFFI bindgen tooling — uniffi-bindgen-swift expects
# a dynamic library to read symbols from when emitting the matching Swift
# module. We produce both; the xcframework consumes the static one.
# `rlib` so `cargo check` / `cargo test` / downstream Rust unit tests work.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
coding-agent-search = { path = ".." }
# `tokio` feature gives UniFFI's async machinery a tokio-aware executor
# so methods declared with `#[uniffi::export(async_runtime = "tokio")]`
# poll on the engine's runtime instead of UniFFI's built-in single-thread
# default. Without it, `spawn_blocking().await` inside our async methods
# deadlocks at runtime because there's no live tokio reactor on the
# polling thread.
uniffi = { version = "0.31", features = ["cli", "tokio"] }

# Re-exported for error construction at the FFI boundary.
anyhow = "*"
thiserror = "*"
parking_lot = "*"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tokio-util = { version = "*", features = ["rt"] }

[dev-dependencies]
# Tests open a CassEngine against a tempdir copy of the in-tree fixture,
# so they don't mutate the committed fixture under tests/fixtures/.
tempfile = "3"

[build-dependencies]
# Modern UniFFI proc-macro mode doesn't strictly require a build.rs, but
# we keep this dep available for when we want to generate scaffolding
# from a UDL file or run uniffi's own build-time validation.
uniffi = { version = "0.31", features = ["build"] }

# uniffi-bindgen-swift is a separate binary crate; it lives under
# [[bin]] so consumers can run it via `cargo run --bin uniffi-bindgen`
# from this directory to emit Swift bindings into a target dir. The
# CassFFI.xcframework build script (bd one-4di061) drives this.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[profile.release]
# Match cass's release profile so the artifacts produced under
# `cargo build --release` link without ABI surprise.
opt-level = 3
lto = "thin"
codegen-units = 16

# Mirror cass's [patch] table here — cargo's [patch] is per-workspace, and
# we made cass-ffi standalone (the `[workspace]` at the top), so cass's
# own [patch] redirects don't propagate into cass-ffi's resolution graph.
# Without these, cargo would fetch frankensqlite/etc. from upstream git
# instead of resolving to the cohort sibling submodules.

[patch."https://github.com/Dicklesworthstone/frankensqlite"]
fsqlite = { path = "../../frankensqlite/crates/fsqlite" }
fsqlite-types = { path = "../../frankensqlite/crates/fsqlite-types" }

[patch."https://github.com/Dicklesworthstone/franken_agent_detection"]
franken-agent-detection = { path = "../../franken_agent_detection" }

[patch."https://github.com/Dicklesworthstone/frankensearch"]
frankensearch = { path = "../../frankensearch/frankensearch" }

[patch."https://github.com/Dicklesworthstone/frankentui"]
ftui = { path = "../../frankentui/crates/ftui" }
ftui-runtime = { path = "../../frankentui/crates/ftui-runtime" }
ftui-tty = { path = "../../frankentui/crates/ftui-tty" }
ftui-extras = { path = "../../frankentui/crates/ftui-extras" }

[patch."https://github.com/Dicklesworthstone/toon_rust"]
tru = { path = "../../toon_rust" }
